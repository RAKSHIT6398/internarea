<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
   <link rel="icon" type="image/png" href="/fav.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>internArea</title>

    <!-- 🚫 Google Translate UI hide (inline = fastest, flicker nahi hoga) -->
    <style>
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      .skiptranslate > iframe,
      .goog-te-balloon-frame,
      .goog-te-gadget-icon,
      .goog-te-gadget,
      #goog-gt-tt,
      .goog-tooltip,
      .goog-tooltip:hover,
      #google_translate_element {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        box-shadow: none !important;
        background: none !important;
      }

      /* select ko DOM me rakho par screen se bahar (script chalti rahe) */
      .goog-te-combo {
        position: absolute !important;
        left: -9999px !important;
        top: -9999px !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      /* body offset / yellow highlight reset */
      body {
        top: 0 !important;
        position: static !important;
      }
      .goog-text-highlight {
        background: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <!-- ═══════ GOOGLE TRANSLATE ═══════ -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages: "en,hi,es,pt,zh-CN,fr",
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
            autoDisplay: false
          },
          "google_translate_element"
        );
      }
    </script>
    <script
      type="text/javascript"
      src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
    </script>

    <script type="module" src="/src/main.jsx"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </body>
</html>
